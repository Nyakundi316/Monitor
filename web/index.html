<!doctype html>
<html lang="en-GB">
<head>
<title>Allion Health Monitor</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
/* Barlow (SIL Open Font License) is bundled so the dashboard works offline in the car */
@font-face { font-family: "Barlow"; font-weight: 400; font-display: swap; src: url("fonts/barlow-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 500; font-display: swap; src: url("fonts/barlow-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 600; font-display: swap; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 700; font-display: swap; src: url("fonts/barlow-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Semi Condensed"; font-weight: 500; font-display: swap; src: url("fonts/barlow-semi-condensed-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Semi Condensed"; font-weight: 600; font-display: swap; src: url("fonts/barlow-semi-condensed-latin-600-normal.woff2") format("woff2"); }
/* Layout: one phone-first column; a warning-lamp cluster summarises each system, the fix list carries the detail. */
:root {
  color-scheme: light;
  --page: #f2f3f1;
  --surface: #fcfcfb;
  --surface-2: #f5f6f5;
  --ink: #19222a;
  --ink-2: #4d5964;
  --muted: #7f8a93;
  --line: #dee2e4;
  --line-strong: #c5cbd0;
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-wash: rgba(42, 120, 214, 0.10);
  --mark-muted: #b4bcc3;
  --band: rgba(12, 163, 12, 0.10);
  --lamp-off: #b9c0c6;
  --crit: #d03b3b;
  --serious: #ec835a;
  --warn: #fab219;
  --good: #0ca30c;
  --watch: #2a78d6;
  --good-ink: #006300;
  --crit-ink: #a52a2a;
  --radius-l: 18px;
  --radius-m: 12px;
  --radius-s: 8px;
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0e1317;
    --surface: #161d23;
    --surface-2: #1b232a;
    --ink: #eaf0f4;
    --ink-2: #a9b5bf;
    --muted: #7b8893;
    --line: #253039;
    --line-strong: #34414b;
    --accent: #3987e5;
    --accent-ink: #86b6ef;
    --accent-wash: rgba(57, 135, 229, 0.14);
    --mark-muted: #4b5862;
    --band: rgba(12, 163, 12, 0.14);
    --lamp-off: #43505a;
    --good-ink: #0ca30c;
    --crit-ink: #ff8a80;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0e1317;
  --surface: #161d23;
  --surface-2: #1b232a;
  --ink: #eaf0f4;
  --ink-2: #a9b5bf;
  --muted: #7b8893;
  --line: #253039;
  --line-strong: #34414b;
  --accent: #3987e5;
  --accent-ink: #86b6ef;
  --accent-wash: rgba(57, 135, 229, 0.14);
  --mark-muted: #4b5862;
  --band: rgba(12, 163, 12, 0.14);
  --lamp-off: #43505a;
  --good-ink: #0ca30c;
  --crit-ink: #ff8a80;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px calc(92px + env(safe-area-inset-bottom)); }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 12px; }
.car-name { font-weight: 700; font-size: 21px; line-height: 1.15; letter-spacing: -0.01em; margin: 0; }
.car-spec { color: var(--ink-2); font-size: 14px; }
.hdr-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.pill .led { width: 9px; height: 9px; border-radius: 50%; background: var(--lamp-off); }
.pill[data-s="live"] .led { background: var(--good); box-shadow: 0 0 6px var(--good); }
.pill[data-s="warn"] .led { background: var(--warn); }
.pill[data-s="bad"] .led { background: var(--crit); }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink-2); }

/* navigation: bottom bar on phones, top bar on wide screens */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
nav.tabs button { appearance: none; background: none; border: 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px 5px; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; min-height: 52px; position: relative; }
nav.tabs button[aria-selected="true"] { color: var(--accent-ink); background: var(--accent-wash); }
nav.tabs .badge { position: absolute; top: 5px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--crit); color: #fff; font-size: 11px; line-height: 16px; font-weight: 600; }
@media (min-width: 760px) {
  nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; display: flex; gap: 4px; border: 0; border-bottom: 1px solid var(--line); background: var(--page); padding: 6px 0; margin: 0 0 18px; }
  nav.tabs button { flex-direction: row; gap: 8px; padding: 8px 14px; font-size: 15px; min-height: 40px; }
  nav.tabs .badge { position: static; }
  .wrap { padding-bottom: 48px; }
}
h2 { font-size: 21px; line-height: 1.2; margin: 28px 0 10px; letter-spacing: -0.01em; }
h2 .sub { display: block; font-size: 14px; font-weight: 400; color: var(--ink-2); letter-spacing: 0; margin-top: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); }
.pad { padding: 16px; }

/* verdict + warning-lamp cluster */
.verdict { position: relative; overflow: hidden; padding: 18px 18px 16px 24px; }
.verdict::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--c, var(--good)); }
.verdict .word { font-size: clamp(32px, 8.5vw, 42px); font-weight: 700; line-height: 1.02; letter-spacing: -0.025em; margin: 0; }
.verdict .line { font-size: 17px; margin: 8px 0 0; max-width: 60ch; }
.verdict .when { font-size: 13.5px; color: var(--muted); margin-top: 8px; }
.lamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
@media (min-width: 560px) { .lamps { grid-template-columns: repeat(8, 1fr); } }
.lamp { appearance: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--lamp-off); cursor: pointer; min-height: 72px; }
.lamp svg.i { width: 28px; height: 28px; stroke-width: 1.7; }
.lamp .lbl { font-size: 12px; color: var(--muted); line-height: 1.1; text-align: center; }
.lamp[data-lit="1"] { border-color: transparent; background: color-mix(in srgb, var(--c) 13%, var(--surface)); }
.lamp[data-lit="1"] svg.i { color: var(--c); filter: drop-shadow(0 0 4px var(--c)); }
.lamp[data-lit="1"] .lbl { color: var(--ink); font-weight: 500; }
.lamp[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.notes { display: grid; gap: 8px; margin-top: 12px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-m); background: var(--surface); border: 1px solid var(--line); font-size: 15px; }
.note svg.i { color: var(--c, var(--muted)); margin-top: 1px; }
.note b { display: block; font-weight: 600; }

/* fix list */
.filter-chip { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px 5px 12px; font-size: 14px; cursor: pointer; }
.fixlist { overflow: hidden; }
.fix { display: grid; grid-template-columns: 4px 30px 1fr; column-gap: 12px; padding: 16px 16px 16px 0; border-top: 1px solid var(--line); }
.fix:first-child { border-top: 0; }
.fix.trend { grid-template-columns: 4px 1fr; }
.fix .tdetail { margin: 6px 0 0; font-size: 15px; color: var(--ink-2); max-width: 72ch; }
.fix .rail { background: var(--c); border-radius: 0 3px 3px 0; }
.fix .n { font-family: var(--font-num); font-weight: 600; font-size: 22px; color: var(--ink-2); text-align: right; line-height: 1.15; }
.fix h3 { margin: 0; font-size: 18px; line-height: 1.25; font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 14px; color: var(--ink-2); }
.urg { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
.urg i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.why { margin: 10px 0 0; padding: 0; list-style: none; font-size: 15px; color: var(--ink-2); }
.why li { padding-left: 15px; position: relative; margin: 4px 0; max-width: 72ch; }
.why b.lead { font-weight: 600; color: var(--ink); }
.why li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.based { font-size: 13px; color: var(--muted); margin-top: 6px; }
.early { font-size: 14px; color: var(--good-ink); margin-top: 6px; }
details.how { margin-top: 10px; }
details.how summary { cursor: pointer; font-weight: 600; font-size: 15px; color: var(--accent-ink); list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary svg.i { width: 16px; height: 16px; transition: transform .15s; }
details.how[open] summary svg.i { transform: rotate(180deg); }
.how-body { font-size: 15px; padding: 6px 0 2px; }
.how-body h4 { margin: 10px 0 4px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.how-body ol, .how-body ul { margin: 0; padding-left: 20px; }
.how-body li { margin: 3px 0; max-width: 72ch; }
.how-body p { margin: 4px 0; max-width: 72ch; }
.empty { padding: 28px 20px; text-align: center; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

/* symptom checker */
.symbox { margin-top: 24px; }
.symbox > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); }
.symbox > summary::-webkit-details-marker { display: none; }
.symbox > summary b { display: block; font-size: 18px; }
.symbox > summary .sub { display: block; font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.symbox[open] > summary { border-radius: var(--radius-l) var(--radius-l) 0 0; border-bottom-color: transparent; }
.symbox[open] > summary svg.i { transform: rotate(180deg); }
.symbox > .panel { border-top: 0; border-radius: 0 0 var(--radius-l) var(--radius-l); }
.sym-groups { display: grid; gap: 14px; }
.sym-group h4 { margin: 0 0 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14.5px; cursor: pointer; text-align: left; line-height: 1.25; }
.chip[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { white-space: nowrap; appearance: none; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--crit-ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.cause { padding: 12px 0; border-top: 1px solid var(--line); }
.cause:first-of-type { border-top: 0; }
.cause-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.cause-head b { font-weight: 600; }
.lk-track { height: 10px; border-radius: 5px; background: var(--surface-2); margin: 8px 0 6px; overflow: hidden; }
.lk-bar { height: 100%; border-radius: 0 5px 5px 0; background: var(--mark-muted); }
.cause.top .lk-bar { background: var(--accent); }
.cause p { margin: 3px 0; font-size: 14.5px; color: var(--ink-2); max-width: 72ch; }
.sym-result h3 { font-size: 17px; margin: 0 0 4px; }

/* live tab */
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-m); margin-bottom: 10px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); }
.alert svg.i { color: var(--c); width: 26px; height: 26px; }
.alert b { display: block; font-size: 17px; }
.trip-strip { display: flex; flex-wrap: wrap; gap: 4px 22px; align-items: baseline; padding: 12px 16px; margin-bottom: 12px; }
.trip-strip .k { font-size: 13px; color: var(--muted); }
.trip-strip .v { font-family: var(--font-num); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.gauges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .gauges { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.g { padding: 12px 14px 10px; border-radius: var(--radius-m); }
.g .lbl { font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g .valrow { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.g .val { font-family: var(--font-num); font-weight: 600; font-size: 30px; line-height: 1.1; margin-top: 2px; font-variant-numeric: tabular-nums; }
.g .val small { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.g .state { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.g .state i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--lamp-off)); }
.g .range { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); margin: 8px 0 4px; box-shadow: inset 0 0 0 1px var(--line); }
.meter .band { position: absolute; top: 0; bottom: 0; background: var(--band); border-radius: 4px; }
.meter .mk { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--c, var(--accent)); box-shadow: 0 0 0 2px var(--surface); transition: left .4s ease; }
.spark { display: block; width: 100%; height: 30px; margin-top: 4px; }
.sound-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; font-size: 14.5px; color: var(--ink-2); }

/* codes tab */
.mil { display: flex; align-items: center; gap: 14px; }
.mil .lampbig { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); color: var(--lamp-off); flex: none; }
.mil .lampbig svg.i { width: 32px; height: 32px; }
.mil[data-on="1"] .lampbig { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); color: #d49000; }
.mil[data-on="1"] .lampbig svg.i { filter: drop-shadow(0 0 5px var(--warn)); }
.mil b { font-size: 18px; display: block; }
.code { padding: 14px 16px; border-top: 1px solid var(--line); }
.code:first-child { border-top: 0; }
.code-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.code-id { font-family: var(--font-num); font-weight: 600; font-size: 19px; padding: 2px 9px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); letter-spacing: 0.02em; }
.kind { font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.kind i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.code p { margin: 6px 0 0; }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th, table.t td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
table.t th { font-weight: 600; color: var(--ink-2); font-size: 13.5px; border-top: 0; }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }
.ready { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.ready div { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 14.5px; }
.ready svg.i { width: 18px; height: 18px; }
.ready .ok svg.i { color: var(--good); }
.ready .no svg.i { color: var(--muted); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 14.5px; }
dl.kv dt { color: var(--ink-2); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }

/* charts */
figure.chart { margin: 0; padding: 14px 14px 10px; position: relative; }
figure.chart figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
figure.chart .t1 { font-weight: 600; font-size: 15.5px; }
figure.chart .t2 { font-size: 13px; color: var(--muted); }
figure.chart svg.plot { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
.charts { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .charts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.axis text { fill: var(--muted); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.grid line { stroke: var(--line); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 7px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 110px; }
.tip .tv { font-weight: 600; font-size: 15px; font-family: var(--font-num); }
.tip .tr { display: flex; align-items: center; gap: 6px; }
.tip .key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); margin: 6px 0 2px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .key { width: 14px; height: 2px; border-radius: 1px; }
.chart-foot { display: flex; justify-content: space-between; gap: 4px 12px; align-items: baseline; flex-wrap: wrap; }
.tbl-toggle { white-space: nowrap;  appearance: none; border: 0; background: none; color: var(--accent-ink); font-size: 13px; cursor: pointer; padding: 2px 0; }

/* service */
.svc { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.svc:first-child { border-top: 0; }
.svc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.svc-head b { font-size: 16.5px; font-weight: 600; }
.svc .prog { height: 6px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; margin: 6px 0 2px; }
.svc .prog div { height: 100%; background: var(--c, var(--accent)); border-radius: 0 3px 3px 0; }
.svc .small { font-size: 14px; color: var(--ink-2); }
.svc-actions { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 16px; margin-top: 6px; }
.svc-actions details.how { margin-top: 4px; flex: 1 1 200px; }
.odo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.odo .big { font-family: var(--font-num); font-weight: 600; font-size: 34px; line-height: 1.05; }

/* drive view */
#drive { position: fixed; inset: 0; z-index: 60; background: var(--page); display: flex; flex-direction: column; padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); gap: 16px; }

/* ------------------------------------------------------------------ formatting */
const nf = (v, d = 0) => (v === null || v === undefined || Number.isNaN(v)) ? "–" :

function initToken() {

/* ------------------------------------------------------------------ demo mode (static preview) */
let demoFrame = 0;
function demoApi(path, opts) {

  if (path.startsWith("api/state")) return Promise.resolve(d.frames[demoFrame % d.frames.length].state);
  if (path.startsWith("api/history")) return Promise.resolve(d.history);
  if (path.startsWith("api/trends")) return Promise.resolve(d.trends);

  const ev = DEMO.evidence || {};
  const out = [];
  for (const id of selected) {
    const sym = DEMO.symptomKB.find(s => s.id === id);
    if (!sym) continue;
    const causes = sym.causes.map(c => {
      let score = c.base; const sup = [], against = [];
      for (const [tag, w] of Object.entries(c.boost || {})) {
        const strength = tag.startsWith("sym:") ? (selected.includes(tag.slice(4)) ? 1 : 0) : (ev[tag] ? ev[tag].strength : 0);
        if (!strength) continue;
        score += w * strength;
        const why = ev[tag] && ev[tag].reasons.length ? ev[tag].reasons[0] : tag;
        (w > 0 ? sup : against).push(why);

    causes.forEach(c => { c.likelihood = Math.round(100 * c.score / total); });
    causes.sort((a, b) => b.score - a.score);

  }
  return out;

  root.replaceChildren(odo, h("h2", {}, "Service schedule", h("span", { class: "sub", text: "Intervals suit Nairobi traffic and dust. Change them in config.toml if your mechanic prefers others." })), list);
}
function editOdometer() {
  const input = h("input", { id: "odoKm", type: "number", inputmode: "numeric", min: "0", step: "1", value: S.report.service.odometer_km ? Math.round(S.report.service.odometer_km) : "" });
  dialog("Odometer reading", [h("label", { for: "odoKm", text: "Kilometres on the dashboard" }), input], [
    h("button", { class: "btn", type: "button", onclick: () => $("#dlg").close() }, "Cancel"),
    h("button", { class: "btn primary", type: "button", onclick: async () => {
      try { await api("api/odometer", { method: "POST", body: { km: Number(input.value) } }); $("#dlg").close(); await loadReport(); renderService(); toast("Odometer saved."); }
      catch (e) { toast(e.message); }
    } }, "Save")]);
}
function markDone(it, svc) {
  const km = h("input", { id: "svcKm", type: "number", inputmode: "numeric", min: "0", value: svc.odometer_km ? Math.round(svc.odometer_km) : "" });
  const date = h("input", { id: "svcDate", type: "date", value: new Date(now() * 1000).toISOString().slice(0, 10) });
  const note = h("input", { id: "svcNote", type: "text", maxlength: "200", placeholder: "e.g. Toyota 0W-20, Total station Ngong Road" });
  dialog(`${it.title} done`, [h("label", { for: "svcKm", text: "Odometer at the time (km)" }), km, h("label", { for: "svcDate", text: "Date" }), date,
    h("label", { for: "svcNote", text: "Note (optional)" }), note], [
    h("button", { class: "btn", type: "button", onclick: () => $("#dlg").close() }, "Cancel"),
    h("button", { class: "btn primary", type: "button", onclick: async () => {
      try { await api("api/service", { method: "POST", body: { item: it.id, km: km.value, date: date.value, note: note.value } }); $("#dlg").close(); await loadReport(); renderService(); toast("Saved."); }
      catch (e) { toast(e.message); }
    } }, "Save")]);
}

/* ------------------------------------------------------------------ loading & live updates */
async function loadReport() { S.report = await api("api/report"); S.lastReportTs = S.report.generated_ts; updateHeader(); }
async function loadTrends() { S.trends = await api("api/trends"); }
function onTick(msg) {
  S.state = msg.state;
  if (msg.row) { S.history.push(msg.row); if (S.history.length > 900) S.history.splice(0, S.history.length - 900); }
  updateHeader(); updateLive(); updateDrive(); handleAlerts();
  if (msg.report_ts && msg.report_ts !== S.lastReportTs) {
    const tripEnded = (msg.state.events || []).some(e => e.kind === "trip_end" && e.ts > (S.lastTripEndSeen || 0));
    loadReport().then(async () => {
      if (tripEnded) { S.lastTripEndSeen = now(); await loadTrends(); if (S.tab === "trends") renderTrends(); }
      if (S.tab === "fix" || S.tab === "codes" || S.tab === "service") render();
    }).catch(() => {});
  }
}
function startStream() {
  if (DEMO) {
    setInterval(() => {
      demoFrame = (demoFrame + 1) % DEMO.frames.length;
      const f = DEMO.frames[demoFrame];
      onTick({ state: f.state, row: f.row, report_ts: DEMO.report.generated_ts });
    }, 1000);
    return;
  }
  const es = new EventSource(`api/stream?t=${encodeURIComponent(S.token)}`);
  es.onmessage = (e) => { S.streamDown = false; try { onTick(JSON.parse(e.data)); } catch (err) { /* ignore bad frame */ } };
  es.onerror = () => { S.streamDown = true; updateHeader(); };
}
async function boot() {
  initTheme(); buildTabs();
  $("#connPill").addEventListener("click", connectionDialog);
  if (DEMO) {
    const b = $("#demoBanner"); b.hidden = false;
    b.textContent = "Preview with simulated data: four weeks of an ageing 1NZ-FE Allion. Run the monitor on your laptop, Raspberry Pi or phone to see your own car.";
  } else {
    initToken();
    if (!S.token) {
      $("#tab-fix").replaceChildren(h("div", { class: "panel empty" }, h("b", { text: "Access key missing" }),
        h("span", { text: "Open the full link printed in the terminal when you started the monitor - it ends with ?t=..." })));
      return;
    }
  }
  try {
    const [state, report, history, trends, symptoms] = await Promise.all([api("api/state"), api("api/report"), api("api/history?n=300"), api("api/trends"), api("api/symptoms")]);
    S.state = state; S.report = report; S.lastReportTs = report.generated_ts; S.history = history; S.trends = trends; S.symptoms = symptoms;
    S.picked = new Set(symptoms.active || []);
  } catch (e) {
    $("#tab-fix").replaceChildren(h("div", { class: "panel empty" }, h("b", { text: "Can't reach the monitor" }), h("span", { text: e.message })));
    return;
  }
  updateHeader(); render(); startStream();
  let rt = null;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (S.tab === "trends") renderTrends(); }, 200); });
}
boot();
</script>
